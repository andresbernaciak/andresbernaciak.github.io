title: Andres Bernaciak | AI x Value Creation
author: Andres Bernaciak
#email: your-email@domain.com
description: > # this means to ignore newlines until "show_exerpts:"
  Strategy and operations leader exploring how AI, agents, and automation
  can solve real operating problems and create measurable business value
show_excerpts: true # set to true to show excerpts on the homepage

header_pages:
  - projects.md
  - writing.md
  - about.md

plainwhite:
  name: "Andres Bernaciak"
  tagline: "Strategy & Operations | Value Creation | CoS | Applied AI"
  date_format: "%b %-d, %Y"
  sitemap: true # set to true to generate sitemap.xml content
  search: true # set to true to enable searchbar
  dark_mode: true # set to true to add dark mode toggle
  portfolio_image: "assets/screenshot.jpg" # the path from the base directory of the site to the image to display (no / at the start)
  html_lang: "en" # set the lang attribute of the <html> tag for the pages. See here for a list of codes: https://www.w3schools.com/tags/ref_country_codes.asp
  condensed_mobile:
    #- home
    - page
    - post


  # generate social links in footer
  social_links:
    github:  andresbernaciak
    linkedIn: in/andresbernaciak

# Build settings

remote_theme: samarsault/plainwhite-jekyll

plugins:
  - jekyll-seo-tag
  - jekyll-remote-theme
#  - jekyll-feed
